# BTunnel — Coturn TURN Server Configuration
#
# TURN relay is used as a fallback when direct P2P (STUN-based UDP hole punching)
# fails. This happens with symmetric NAT (~15-20% of users).
#
# IMPORTANT: DTLS encryption covers TURN traffic too — the TURN server
# only relays encrypted packets and cannot read their content.
#
# Install coturn:
#   apt install coturn       (Debian/Ubuntu)
#   yum install coturn       (CentOS/RHEL)
#   brew install coturn      (macOS)
#
# Start:
#   turnserver -c /path/to/coturn.conf
#
# Reference: https://github.com/coturn/coturn

# ─────────────────────────────────────────────────
# Network
# ─────────────────────────────────────────────────

# Listener port for TURN (UDP + TCP)
listening-port=3478

# TLS listener port
tls-listening-port=5349

# External IP address (replace with your server's public IP)
# If behind NAT, specify: external-ip=<PUBLIC_IP>/<PRIVATE_IP>
# external-ip=203.0.113.1

# Relay IP range
# min-port=49152
# max-port=65535

# ─────────────────────────────────────────────────
# Authentication
# ─────────────────────────────────────────────────

# Use short-term credentials (generated dynamically by signaling server)
# The signaling server creates temporary TURN credentials with 1-hour TTL
use-auth-secret

# Shared secret between signaling server and coturn
# IMPORTANT: Change this in production! Generate with:
#   openssl rand -hex 32
static-auth-secret=CHANGE_ME_IN_PRODUCTION_USE_OPENSSL_RAND_HEX_32

# ─────────────────────────────────────────────────
# Security
# ─────────────────────────────────────────────────

# Realm (your domain)
realm=btunnel.live

# Fingerprint for STUN messages
fingerprint

# Long-term credential mechanism is not used (we use auth-secret)
no-multicast-peers

# Deny relaying to private IP ranges (prevent SSRF attacks)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# ─────────────────────────────────────────────────
# TLS / DTLS
# ─────────────────────────────────────────────────

# TLS certificate and key (for TURNS — TLS-encrypted TURN)
# Use Let's Encrypt certificates:
# cert=/etc/letsencrypt/live/turn.btunnel.live/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.btunnel.live/privkey.pem

# Cipher suites
# cipher-list="ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256"

# ─────────────────────────────────────────────────
# Performance & Limits
# ─────────────────────────────────────────────────

# Total relay bandwidth limit (bytes per second)
# 100 Mbps = 12500000 bytes/sec
max-bps=12500000

# Per-session bandwidth limit (bytes per second)
# 10 Mbps = 1250000 bytes/sec
bps-capacity=1250000

# Maximum number of simultaneous allocations
total-quota=100

# User quota (allocations per user)
user-quota=5

# Stale nonce timeout (seconds)
stale-nonce=600

# ─────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────

# Log file
log-file=/var/log/coturn/turn.log

# Verbose logging (disable in production)
# verbose

# Standard log (enable for production)
syslog

# No stdout logging
no-stdout-log

# ─────────────────────────────────────────────────
# Process
# ─────────────────────────────────────────────────

# Run as daemon
# daemon

# PID file
pidfile=/var/run/coturn/turnserver.pid

# Drop privileges to this user after startup
proc-user=turnserver
proc-group=turnserver
